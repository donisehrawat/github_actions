name: Campus Event Manager Validation

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

  workflow_dispatch:

jobs:
  validate-application:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: List files
        run: ls

      - name: Show trigger
        run: 'echo "Workflow triggered by: ${{ github.event_name }}"'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test